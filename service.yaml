# Google Cloud Run Service Configuration
# Deploy with: gcloud run services replace service.yaml
#
# This file defines the Cloud Run service configuration
# Environment variables and secrets should be set separately for security

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: lasso
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        # Autoscaling
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '10'

        # Resource limits
        run.googleapis.com/cpu-throttling: 'true'
        run.googleapis.com/startup-cpu-boost: 'true'

        # Execution environment
        run.googleapis.com/execution-environment: gen2

        # VPC Connector (if needed for VPC resources)
        # run.googleapis.com/vpc-access-connector: projects/PROJECT_ID/locations/REGION/connectors/CONNECTOR_NAME
        # run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: PROJECT_NUMBER-compute@developer.gserviceaccount.com

      containers:
      - name: lasso
        image: gcr.io/PROJECT_ID/lasso:latest

        ports:
        - name: http1
          containerPort: 8080

        resources:
          limits:
            cpu: '1000m'
            memory: 512Mi

        env:
        # Non-sensitive environment variables
        - name: ENVIRONMENT
          value: production

        - name: HOST
          value: 0.0.0.0

        - name: PORT
          value: '8080'

        - name: LASTFM_API_BASE_URL
          value: https://ws.audioscrobbler.com

        - name: LASTFM_AUTH_URL
          value: https://www.last.fm

        - name: LOG_LEVEL
          value: info

        - name: LOG_FORMAT
          value: json

        - name: SESSION_COOKIE_SECURE
          value: 'true'

        - name: SESSION_COOKIE_HTTP_ONLY
          value: 'true'

        - name: SESSION_COOKIE_SAME_SITE
          value: strict

        - name: RATE_LIMIT_ENABLED
          value: 'true'

        - name: RATE_LIMIT_MAX_REQUESTS
          value: '100'

        - name: RATE_LIMIT_WINDOW_MS
          value: '60000'

        - name: POLLING_INTERVAL_MS
          value: '20000'

        # These should be set via gcloud command or Secret Manager
        # NOT in this file for security
        # - name: LASTFM_API_KEY
        #   value: SET_VIA_SECRET_MANAGER
        # - name: LASTFM_API_SECRET
        #   valueFrom:
        #     secretKeyRef:
        #       name: lastfm-api-secret
        #       key: latest
        # - name: SESSION_SECRET
        #   valueFrom:
        #     secretKeyRef:
        #       name: session-secret
        #       key: latest
        # - name: OAUTH_CALLBACK_URL
        #   value: SET_VIA_GCLOUD_COMMAND

        # Liveness probe
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        # Startup probe
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3

  traffic:
  - percent: 100
    latestRevision: true
