name: Deploy to Staging

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

env:
  GCP_PROJECT_ID: lasso-scrobbler-0667
  GCP_REGION: us-central1
  SERVICE_NAME: lasso-staging
  ENVIRONMENT: staging

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from branch
        id: version
        run: |
          if [[ "${{ github.ref }}" =~ release/([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "📦 Release version: $VERSION"
          else
            echo "version=staging-latest" >> $GITHUB_OUTPUT
            echo "📦 Using staging-latest tag"
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io

      - name: Build Docker image
        run: |
          echo "🔨 Building Docker image for staging..."
          docker build -t gcr.io/${{ env.GCP_PROJECT_ID }}/lasso:${{ github.sha }} \
                       -t gcr.io/${{ env.GCP_PROJECT_ID }}/lasso:${{ steps.version.outputs.version }} \
                       -t gcr.io/${{ env.GCP_PROJECT_ID }}/lasso:staging-latest .

      - name: Push Docker image to GCR
        run: |
          echo "📦 Pushing image to Google Container Registry..."
          docker push gcr.io/${{ env.GCP_PROJECT_ID }}/lasso:${{ github.sha }}
          docker push gcr.io/${{ env.GCP_PROJECT_ID }}/lasso:${{ steps.version.outputs.version }}
          docker push gcr.io/${{ env.GCP_PROJECT_ID }}/lasso:staging-latest

      - name: Deploy to Cloud Run (Staging)
        run: |
          echo "🚀 Deploying to Cloud Run staging environment..."
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image gcr.io/${{ env.GCP_PROJECT_ID }}/lasso:${{ github.sha }} \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --max-instances 5 \
            --min-instances 0 \
            --set-env-vars ENVIRONMENT=${{ env.ENVIRONMENT }},LASTFM_API_BASE_URL=https://ws.audioscrobbler.com,LASTFM_AUTH_URL=https://www.last.fm,LOG_LEVEL=info \
            --set-secrets LASTFM_API_KEY=lastfm-api-key:latest,LASTFM_API_SECRET=lastfm-api-secret:latest,SESSION_SECRET=session-secret:latest

      - name: Get service URL
        id: get-url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.url)')
          echo "url=$SERVICE_URL" >> $GITHUB_OUTPUT
          echo "🌐 Service URL: $SERVICE_URL"

      - name: Run comprehensive smoke tests
        run: |
          echo "🧪 Running comprehensive smoke tests..."
          SERVICE_URL="${{ steps.get-url.outputs.url }}"

          # Health check
          echo "Testing health endpoint..."
          health_status=$(curl -s -o /dev/null -w "%{http_code}" $SERVICE_URL/health)
          if [ "$health_status" != "200" ]; then
            echo "❌ Health check failed: $health_status"
            exit 1
          fi
          echo "✅ Health check passed"

          # Home page check
          echo "Testing home page..."
          home_status=$(curl -s -o /dev/null -w "%{http_code}" $SERVICE_URL/)
          if [ "$home_status" != "200" ]; then
            echo "❌ Home page check failed: $home_status"
            exit 1
          fi
          echo "✅ Home page check passed"

          # Static assets check
          echo "Testing CSS asset..."
          css_status=$(curl -s -o /dev/null -w "%{http_code}" $SERVICE_URL/css/tailwind.css)
          if [ "$css_status" != "200" ]; then
            echo "❌ CSS asset check failed: $css_status"
            exit 1
          fi

          # Verify CSS content
          css_content=$(curl -s $SERVICE_URL/css/tailwind.css | head -c 100)
          if ! echo "$css_content" | grep -q "tw-"; then
            echo "❌ CSS content validation failed"
            exit 1
          fi
          echo "✅ CSS asset check passed"

          echo "Testing JS asset..."
          js_status=$(curl -s -o /dev/null -w "%{http_code}" $SERVICE_URL/js/main.js)
          if [ "$js_status" != "200" ]; then
            echo "❌ JS asset check failed: $js_status"
            exit 1
          fi

          # Verify JS content
          js_content=$(curl -s $SERVICE_URL/js/main.js | head -c 100)
          if ! echo "$js_content" | grep -q "shadow\$provide\|var "; then
            echo "❌ JS content validation failed"
            exit 1
          fi
          echo "✅ JS asset check passed"

          # Security headers check
          echo "Verifying security headers..."
          headers=$(curl -s -I $SERVICE_URL/)
          if ! echo "$headers" | grep -q "X-Frame-Options"; then
            echo "⚠️  Warning: X-Frame-Options header missing"
          fi
          if ! echo "$headers" | grep -q "Content-Security-Policy"; then
            echo "⚠️  Warning: Content-Security-Policy header missing"
          fi
          echo "✅ Security headers check passed"

      - name: Performance check
        run: |
          echo "⚡ Running performance checks..."
          SERVICE_URL="${{ steps.get-url.outputs.url }}"

          # Test response time
          response_time=$(curl -o /dev/null -s -w '%{time_total}\n' $SERVICE_URL/health)
          echo "Response time: ${response_time}s"

          # Warn if response time > 2 seconds
          if (( $(echo "$response_time > 2.0" | bc -l) )); then
            echo "⚠️  Warning: Response time exceeds 2 seconds"
          else
            echo "✅ Performance check passed"
          fi

      - name: Deployment summary
        run: |
          echo "✅ Staging deployment successful!"
          echo ""
          echo "📊 Deployment Summary:"
          echo "  Environment: ${{ env.ENVIRONMENT }}"
          echo "  Service: ${{ env.SERVICE_NAME }}"
          echo "  Region: ${{ env.GCP_REGION }}"
          echo "  Version: ${{ steps.version.outputs.version }}"
          echo "  Image: gcr.io/${{ env.GCP_PROJECT_ID }}/lasso:${{ github.sha }}"
          echo "  URL: ${{ steps.get-url.outputs.url }}"
          echo ""
          echo "🔍 Next steps:"
          echo "  1. Perform manual testing on staging"
          echo "  2. Verify OAuth flow works end-to-end"
          echo "  3. Test session management features"
          echo "  4. If all tests pass, merge release branch to main for production deployment"
          echo ""
          echo "🔍 View logs:"
          echo "  gcloud logging read \"resource.type=cloud_run_revision AND resource.labels.service_name=${{ env.SERVICE_NAME }}\" --limit 50 --project ${{ env.GCP_PROJECT_ID }}"

      - name: Post deployment comment
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.version.outputs.version }}';
            const url = '${{ steps.get-url.outputs.url }}';
            const sha = '${{ github.sha }}';

            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
              body: `🚀 **Staging Deployment Successful**\n\n` +
                    `📦 Version: \`${version}\`\n` +
                    `🌐 URL: ${url}\n` +
                    `🔍 [View Logs](https://console.cloud.google.com/run/detail/${{ env.GCP_REGION }}/${{ env.SERVICE_NAME }}/logs?project=${{ env.GCP_PROJECT_ID }})\n\n` +
                    `✅ All smoke tests passed`
            });
