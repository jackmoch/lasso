name: Deploy to Dev

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  GCP_PROJECT_ID: lasso-scrobbler-0667
  GCP_REGION: us-central1
  SERVICE_NAME: lasso-dev
  ENVIRONMENT: development

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io

      - name: Build Docker image
        run: |
          echo "🔨 Building Docker image..."
          docker build -t gcr.io/${{ env.GCP_PROJECT_ID }}/lasso:${{ github.sha }} \
                       -t gcr.io/${{ env.GCP_PROJECT_ID }}/lasso:dev-latest .

      - name: Push Docker image to GCR
        run: |
          echo "📦 Pushing image to Google Container Registry..."
          docker push gcr.io/${{ env.GCP_PROJECT_ID }}/lasso:${{ github.sha }}
          docker push gcr.io/${{ env.GCP_PROJECT_ID }}/lasso:dev-latest

      - name: Deploy to Cloud Run (Dev)
        run: |
          echo "🚀 Deploying to Cloud Run dev environment..."
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image gcr.io/${{ env.GCP_PROJECT_ID }}/lasso:${{ github.sha }} \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --max-instances 3 \
            --min-instances 0 \
            --set-env-vars ENVIRONMENT=${{ env.ENVIRONMENT }},LASTFM_API_BASE_URL=https://ws.audioscrobbler.com,LASTFM_AUTH_URL=https://www.last.fm,LOG_LEVEL=debug \
            --set-secrets LASTFM_API_KEY=lastfm-api-key:latest,LASTFM_API_SECRET=lastfm-api-secret:latest,SESSION_SECRET=session-secret:latest

      - name: Get service URL
        id: get-url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.url)')
          echo "url=$SERVICE_URL" >> $GITHUB_OUTPUT
          echo "🌐 Service URL: $SERVICE_URL"

      - name: Run smoke tests
        run: |
          echo "🧪 Running smoke tests..."
          SERVICE_URL="${{ steps.get-url.outputs.url }}"

          # Health check
          echo "Testing health endpoint..."
          health_status=$(curl -s -o /dev/null -w "%{http_code}" $SERVICE_URL/health)
          if [ "$health_status" != "200" ]; then
            echo "❌ Health check failed: $health_status"
            exit 1
          fi
          echo "✅ Health check passed"

          # Home page check
          echo "Testing home page..."
          home_status=$(curl -s -o /dev/null -w "%{http_code}" $SERVICE_URL/)
          if [ "$home_status" != "200" ]; then
            echo "❌ Home page check failed: $home_status"
            exit 1
          fi
          echo "✅ Home page check passed"

          # Static assets check
          echo "Testing CSS asset..."
          css_status=$(curl -s -o /dev/null -w "%{http_code}" $SERVICE_URL/css/tailwind.css)
          if [ "$css_status" != "200" ]; then
            echo "❌ CSS asset check failed: $css_status"
            exit 1
          fi
          echo "✅ CSS asset check passed"

          echo "Testing JS asset..."
          js_status=$(curl -s -o /dev/null -w "%{http_code}" $SERVICE_URL/js/main.js)
          if [ "$js_status" != "200" ]; then
            echo "❌ JS asset check failed: $js_status"
            exit 1
          fi
          echo "✅ JS asset check passed"

      - name: Deployment summary
        run: |
          echo "✅ Deployment successful!"
          echo ""
          echo "📊 Deployment Summary:"
          echo "  Environment: ${{ env.ENVIRONMENT }}"
          echo "  Service: ${{ env.SERVICE_NAME }}"
          echo "  Region: ${{ env.GCP_REGION }}"
          echo "  Image: gcr.io/${{ env.GCP_PROJECT_ID }}/lasso:${{ github.sha }}"
          echo "  URL: ${{ steps.get-url.outputs.url }}"
          echo ""
          echo "🔍 View logs:"
          echo "  gcloud logging read \"resource.type=cloud_run_revision AND resource.labels.service_name=${{ env.SERVICE_NAME }}\" --limit 50 --project ${{ env.GCP_PROJECT_ID }}"
